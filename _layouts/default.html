<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="site-shell site-nav">
        <a class="site-brand" href="{{ "/" | relative_url }}">
          <span class="site-brand__name">{{ site.title }}</span>
          <span class="site-brand__meta">Data science and machine learning</span>
        </a>

        <nav class="site-menu" aria-label="Primary navigation">
          <a href="{{ "/" | relative_url }}">Home</a>
          <a href="{{ "/blog/" | relative_url }}">Blog</a>
          <a href="{{ "/publications.html" | relative_url }}">Publications</a>
          <a href="{{ "/projects.html" | relative_url }}">Projects</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="page-content">
      <div class="site-shell content-shell">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-shell footer-inner">
        <p>{{ site.description }}</p>
        <div class="footer-links">
          <a href="https://github.com/{{ site.github_username }}">GitHub</a>
          <a href="https://twitter.com/{{ site.twitter_username }}">Twitter</a>
          <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}">LinkedIn</a>
        </div>
      </div>
    </footer>
  </body>
</html>
